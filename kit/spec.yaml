schemaVersion: "2"
kind: sandbox
name: sonar-claude
version: "0.1.0"
displayName: Sonar + Docker — Claude Code
description: Claude Code with Sonar Vortex guidance and verification, checked before the agent starts.
extends: claude
args:
  organization:
    required: true
    description: SonarQube Cloud organization key
    pattern: '^[A-Za-z0-9_.-]+$'
  project:
    required: true
    description: Existing SonarQube Cloud project key with Vortex enabled
    pattern: '^[A-Za-z0-9_.:-]+$'
  cloud-domain:
    default: sonarcloud.io
    enum: [sonarcloud.io, sonarqube.us]
credentials:
  - service: sonar-cloud
    description: SonarQube Cloud user token for the selected region
    required: true
    apiKey:
      name: SONARQUBE_CLI_TOKEN
      proxyManaged: true
      inject:
        - domain: "${{ kit.args.cloud-domain }}"
          scheme: bearer
        - domain: "api.${{ kit.args.cloud-domain }}"
          scheme: bearer
permissions:
  network:
    allow:
      - "${{ kit.args.cloud-domain }}"
      - "api.${{ kit.args.cloud-domain }}"
      - binaries.sonarsource.com
environment:
  variables:
    SONARQUBE_CLI_ORG: "${{ kit.args.organization }}"
    SONARQUBE_CLI_SERVER: "https://${{ kit.args.cloud-domain }}"
    SONAR_KIT_PROJECT: "${{ kit.args.project }}"
setup:
  install:
    - command: python3 /home/agent/sonar-kit/install.py
      user: "0"
      description: Install the checksum-pinned SonarQube CLI listed in versions.json
  files:
    - path: /home/agent/sonar-kit/workspace.txt
      content: "${WORKDIR}"
      mode: "0600"
sandbox:
  # A synchronous entrypoint is essential: setup.startup does not gate the agent.
  entrypoint: [python3, /home/agent/sonar-kit/entrypoint.py]
  command:
    default: []
    interactive: []
agentInstructions:
  filename: CLAUDE.md
  content: |
    This workspace uses Sonar Vortex guidance and verification.
    Follow the Sonar-generated project instructions and hooks.
    Preserve existing user changes. Do not disable Sonar hooks or sandbox policy
    to make a failing check pass. Report a failed or skipped analysis explicitly.
    Before finishing, run the project's tests and Sonar DEEP analysis for the
    files you changed. Distinguish actual Sonar output from your own review.
